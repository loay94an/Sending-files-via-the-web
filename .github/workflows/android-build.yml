name: Build Arabic Concepts-inspired Android APK

on:
  push:
    branches: [concepts-arabic-ai]
    paths:
      - '.github/workflows/android-build.yml'
      - 'bootstrap/**'
      - 'Concepts-Arabic/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  PROJECT_DIR: Concepts-Arabic

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated project branch
        uses: actions/checkout@v4
        with:
          ref: concepts-arabic-ai
          fetch-depth: 0

      - name: Expand the first-commit source bundle
        shell: bash
        run: |
          if [ -d bootstrap ] && compgen -G 'bootstrap/*.b64' > /dev/null; then
            mkdir -p "$PROJECT_DIR"
            cat bootstrap/*.b64 | base64 --decode | tar -xJf - -C .
            rm -rf bootstrap
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m '[skip ci] Expand Mafahim Canvas source tree'
              git push origin "HEAD:$GITHUB_REF_NAME"
            fi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Run unit tests
        working-directory: Concepts-Arabic
        run: gradle testDebugUnitTest

      - name: Build APK
        working-directory: Concepts-Arabic
        run: gradle assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mafahim-canvas-debug-apk
          path: Concepts-Arabic/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mafahim-canvas-test-reports
          path: Concepts-Arabic/app/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14
