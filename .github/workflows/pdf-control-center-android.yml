name: PDF Control Center Android APK
on:
  push:
    branches: [feature/new-pdf-ai-control-center]
    paths: ['apps/pdf-control-center-android/**', '.github/workflows/pdf-control-center-android.yml']
  pull_request:
    paths: ['apps/pdf-control-center-android/**', '.github/workflows/pdf-control-center-android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with: { packages: platform-tools }
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build debug APK
        working-directory: apps/pdf-control-center-android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-control-center-debug-apk
          path: apps/pdf-control-center-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
