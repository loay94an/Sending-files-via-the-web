name: Build Wasla EShare Remote APK

on:
  push:
    branches: [feat/eshare-arabic-remote, fix/eshare-hotspot-airmouse, fix/airmouse-protocol-scaling, fix/pointer-click-protocol, feat/eshare-text-longpress-reconnect, feat/wasla-tv-server-foundation, feat/wasla-functional-receiver-phase1]
    tags: ["v*"]
    paths:
      - "android-eshare-remote/**"
      - ".github/workflows/build-eshare-remote.yml"
  pull_request:
    branches: [main, feat/eshare-text-longpress-reconnect]
    paths:
      - "android-eshare-remote/**"
      - ".github/workflows/build-eshare-remote.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Read app version
        id: app-version
        working-directory: android-eshare-remote
        run: |
          source version.properties
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          tv_name=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' tv-receiver/build.gradle.kts | head -1)
          echo "tv_name=$tv_name" >> "$GITHUB_OUTPUT"
      - name: Build phone remote and TV receiver APKs
        working-directory: android-eshare-remote
        run: gradle :app:assembleDebug :tv-receiver:assembleDebug
      - name: Upload phone remote APK
        uses: actions/upload-artifact@v4
        with:
          name: wasla-eshare-remote-v${{ steps.app-version.outputs.name }}-code${{ steps.app-version.outputs.code }}
          path: android-eshare-remote/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload TV receiver APK
        uses: actions/upload-artifact@v4
        with:
          name: wasla-tv-receiver-v${{ steps.app-version.outputs.tv_name }}
          path: android-eshare-remote/tv-receiver/build/outputs/apk/debug/tv-receiver-debug.apk
          if-no-files-found: error
      - name: Prepare release APKs
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p release-assets
          cp android-eshare-remote/app/build/outputs/apk/debug/app-debug.apk "release-assets/wasla-eshare-remote-v${{ steps.app-version.outputs.name }}.apk"
          cp android-eshare-remote/tv-receiver/build/outputs/apk/debug/tv-receiver-debug.apk "release-assets/wasla-tv-receiver-v${{ steps.app-version.outputs.tv_name }}.apk"
      - name: Publish APKs to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "وصلة ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            release-assets/wasla-eshare-remote-v${{ steps.app-version.outputs.name }}.apk
            release-assets/wasla-tv-receiver-v${{ steps.app-version.outputs.tv_name }}.apk
