name: Smart PDF Control Center Android
on:
  workflow_dispatch:
  pull_request:
    branches: [feature/pdf-page-export-local-model-chat]
    paths:
      - 'apps/smart-control-center/**'
      - '.github/workflows/smart-control-center-android.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p apps/smart-control-center/android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: smart-pdf-control-center-debug-apk
          path: apps/smart-control-center/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
