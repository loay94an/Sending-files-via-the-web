name: Build Android TV Remote APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".gitmodules"
      - "android-tv-remote/**"
      - ".github/workflows/android-tv-remote.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Wasla with Android remote source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply Arabic UI and D-pad fix
        run: python3 android-tv-remote/patch_source.py

      - name: Build APK
        working-directory: android-tv-remote/source
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-tv-remote-arabic-debug-apk
          path: android-tv-remote/source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
